services:
  edgeterminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: edgeterminal-postgres:latest
    container_name: edgeterminal
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER}
      NODE_ENV: ${NODE_ENV}
      APP_BASE_URL: ${APP_BASE_URL}
    
      CTRADER_CLIENT_ID: ${CTRADER_CLIENT_ID}
      CTRADER_CLIENT_SECRET: ${CTRADER_CLIENT_SECRET}
      CTRADER_REDIRECT_URI: ${CTRADER_REDIRECT_URI}
      CTRADER_TOKEN_ENCRYPTION_KEY: ${CTRADER_TOKEN_ENCRYPTION_KEY}
    
      EXNESS_TEST_MODE: ${EXNESS_TEST_MODE}
      EXNESS_TEST_API_KEY: ${EXNESS_TEST_API_KEY}
      EXNESS_TEST_PRIVATE_KEY: ${EXNESS_TEST_PRIVATE_KEY}
      EXNESS_TEST_ACCOUNT_ID: ${EXNESS_TEST_ACCOUNT_ID}
      EXNESS_TEST_GATEWAY_URL: ${EXNESS_TEST_GATEWAY_URL}
      EXNESS_CREDENTIALS_ENCRYPTION_KEY: ${EXNESS_CREDENTIALS_ENCRYPTION_KEY}
    
      ORDERFLOW_DATA_MODE: ${ORDERFLOW_DATA_MODE}
      ECONOMIC_DATA_MODE: ${ECONOMIC_DATA_MODE}
      MARKET_DATA_MODE: ${MARKET_DATA_MODE}
    
      TRADING_ECONOMICS_API_KEY: ${TRADING_ECONOMICS_API_KEY}
      TRADING_ECONOMICS_API_SECRET: ${TRADING_ECONOMICS_API_SECRET}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}
    
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      FRED_API_KEY: ${FRED_API_KEY}
    
      PUSH_CRON_SECRET: ${PUSH_CRON_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      
    volumes:
      - edgeterminal_data:/app/data
    networks:
      - edgeterminal_db_net

volumes:
  edgeterminal_data:
    external: true

networks:
  edgeterminal_db_net:
    external: true
