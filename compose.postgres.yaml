# Standalone PostgreSQL service for the staged migration.
# Deploy as a separate Portainer stack. Do not expose 5432 publicly.
services:
  edgeterminal-postgres:
    image: postgres:16-alpine
    container_name: edgeterminal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgeterminal_db}
      POSTGRES_USER: ${POSTGRES_USER:-edgeterminal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in Portainer}
    volumes:
      - edgeterminal_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edgeterminal_db_net
volumes:
  edgeterminal_postgres_data:
    name: edgeterminal_postgres_data
networks:
  edgeterminal_db_net:
    name: edgeterminal_db_net
